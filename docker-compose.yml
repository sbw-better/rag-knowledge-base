services:
  mysql:
    image: mysql:8.4
    container_name: ragkb-mysql
    environment:
      MYSQL_DATABASE: ragkb
      MYSQL_USER: rag
      MYSQL_PASSWORD: rag
      MYSQL_ROOT_PASSWORD: rag-root
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -urag -prag --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ragkb-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: ragkb-milvus-etcd
    command: >
      etcd
      -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - milvus-etcd-data:/etcd

  milvus-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ragkb-milvus-minio
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - milvus-minio-data:/data

  milvus:
    image: milvusdb/milvus:v2.6.2
    container_name: ragkb-milvus
    command: ["milvus", "run", "standalone"]
    depends_on:
      - milvus-etcd
      - milvus-minio
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus

  attu:
    image: zilliz/attu:v2.4
    container_name: ragkb-attu
    depends_on:
      - milvus
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "8000:3000"

  app:
    build: .
    container_name: ragkb-app
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
      milvus:
        condition: service_started
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ragkb?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: rag
      DB_PASSWORD: rag
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: rag-documents
      MILVUS_ENDPOINT: http://milvus:19530
      MILVUS_DATABASE: default
      MILVUS_COLLECTION: rag_document_chunks
      JWT_SECRET: please-change-this-very-long-secret-in-production
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-qwen3.7-plus}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-v4}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
    ports:
      - "8080:8080"

volumes:
  mysql-data:
  minio-data:
  milvus-etcd-data:
  milvus-minio-data:
  milvus-data:
